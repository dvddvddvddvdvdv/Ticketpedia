<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>TicketPedia - Dashboard</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/tab-style/buy.css">
</head>
<body>
    <nav>
        <div class="nav">
            <div class="icon">
                <img class="title" src="assets/ticketpedia.png" alt="TicketPedia Logo">
                <div class="menu">
                    <img src="assets/MENU.png" alt="Menu">
                </div>

                <div class="selection">
                    <div class="selected"></div>
                    <a href="dashboard.html"><img src="assets/Home_sel.png" alt="Home"></a>
                </div>
                <div class="selection">
                    <a href="Settings.html"><img src="assets/gear.png" alt="Settings"></a>
                </div>
                <div class="selection">
                    <a href="Account.html"><img src="assets/profile.png" alt="Profile"></a>
                </div>
                <div class="selection">
                    <a href="tickets.html"><img src="assets/tickets.png" alt="Tickets"></a>
                </div>
            </div>
        </div>

        <div class="top-nav">
            <div class="top-icon">
                <img src="assets/logo.png" alt="">
                <div class="diva"></div>
                <a href="#"><img src="assets/Notif.png" alt=""></a>
                <a href="#"><img src="assets/Email.png" alt=""></a>
                <div class="user-profile">
                    <a href="#"><img class="Profile_picture" src="assets/profiles/p1.png" alt=""></a>
                    <div class="divs">
                        <p id="navUsername" class="username">Loading...</p>
                        <p id="navEmail" class="Email-name">...</p>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main>
        <div class="tab-menu-container">
            <ul class="tab-list">
                <li class="tab-link active" data-target="pembelian">Pembelian ticket</li>
                <li class="tab-divider">|</li>
                <li class="tab-link" data-target="aktif">Tiket Aktif</li>
                <li class="tab-divider">|</li>
                <li class="tab-link" data-target="riwayat">Riwayat Pemesanan</li>
                <li class="tab-divider">|</li>
                <li class="tab-link" data-target="pembayaran">Pembayaran &amp; Pengembalian Dana</li>
            </ul>
        </div>

        <!-- The Content Sections -->
        <div id="pembelian" class="tab-content active-content">
            <div class="ticket-controls">
                <input type="text" class="search-bar" placeholder="Search Bar">
                <button class="filter-btn">
                    Filter 
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
                </button>
                <button class="filter-tag">Direct</button>
                <button class="filter-tag">Transit</button>
            </div>

            <div class="ticket-list">
               
            </div>
        </div>
        
        <div id="riwayat" class="tab-content">
            <h2>Riwayat Pemesanan Content</h2>
        </div>
        
        <div id="pembayaran" class="tab-content">
            <div class="payment-card-container">
                <h2 class="section-title">Konfirmasi Pembayaran</h2>
                
                <div class="payment-form-grid" style="grid-template-columns: 1fr 1fr;">
                    <!-- Kolom 1: Informasi Tagihan -->
                    <div class="form-column">
                        <div class="input-group">
                            <label>Booking ID (PNR)</label>
                            <input type="text" class="booking-input" value="97CMS8" disabled style="background-color: #E9EAEE; cursor: not-allowed;">
                        </div>
                        
                        <div class="input-group">
                            <label>Total Tagihan</label>
                            <input type="text" class="booking-input" value="Rp 18.450.000" disabled style="background-color: #E9EAEE; cursor: not-allowed;">
                        </div>

                        <div class="input-group">
                            <label>Transfer ke Bank *</label>
                            <select class="booking-input">
                                <option>Pilih Bank Tujuan</option>
                                <option>BCA - 1234567890 (a.n TicketPedia)</option>
                                <option>Mandiri - 0987654321 (a.n TicketPedia)</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-column">
                        <div class="input-group">
                            <label>Nama Pengirim / Rekening Asal *</label>
                            <input type="text" class="booking-input" placeholder="Masukkan nama pemilik rekening">
                        </div>

                        <div class="input-group">
                            <label>Tanggal Transfer *</label>
                            <input type="date" class="booking-input">
                        </div>

                        <div class="input-group">
                            <label>Bukti Pembayaran (.jpg, .pdf) *</label>
                            <input type="file" class="file-input" accept=".jpg,.pdf">
                        </div>
                    </div>
                </div>

                <div class="payment-footer">
                    <button class="btn-submit-payment" onclick="submitPayment()">Kirim Konfirmasi</button>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="./typescript/dashboard.ts"></script>
</body>
</html>
