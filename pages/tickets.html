<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>TicketPedia</title>
    <link rel="stylesheet" href="/css/tickets.css">
    <link rel="stylesheet" href="/css/global.css">
</head>
<body>
    <nav>
        <div class="nav">
            <div class="icon">
                <img class="title" src="assets/ticketpedia.png" alt="TicketPedia Logo">
                <div class="menu">
                    <img src="assets/MENU.png" alt="Menu">
                </div>
                <!-- Navigation Items -->
                <div class="selection">
                    <div class="selected"></div>
                    <a href="dashboard.html"><img src="assets/Home.png" alt="Home"></a>
                </div>
                <div class="selection">
                    <a href="Settings.html"><img src="assets/gear.png" alt="Settings"></a>
                </div>
                <div class="selection">
                    <a href="Account.html"><img src="assets/profile.png" alt="Profile"></a>
                </div>
                <div class="selection">
                    <a href="tickets.html"><img src="assets/tickets_sel.png" alt="Tickets"></a>
                </div>
            </div>
        </div>
        <div class="top-nav">
            <div class="top-icon">
                <img src="assets/logo.png" alt="">
                <div class="diva"></div>
                <a href="#"><img src="assets/Notif.png" alt=""></a>
                <a href="#"><img src="assets/Email.png" alt=""></a>
                <div class="user-profile">
                    <a href="#"><img class="Profile_picture" src="assets/profiles/p1.png" alt=""></a>
                    <div class="divs">
                        <p id="navUsername" class="username">Loading...</p>
                        <p id="navEmail" class="Email-name">...</p>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main>

    </main>


    <script type="module">
        import { pb } from '../src/pocketbase';

        if (pb.authStore.isValid && pb.authStore.model) {
            const user = pb.authStore.model;
            
            const usernameEl = document.querySelector('#navUsername');
            const emailEl = document.querySelector('#navEmail');

            if (usernameEl) usernameEl.textContent = user.username || 'User';
            if (emailEl) emailEl.textContent = user.email || '';
        } else {
            window.location.href = '../login.html';
        }
    </script>

</body>
</html>
