<body>
     <nav>

                        </span>
                        <span class="nav-label">Beranda</span>
                    </a>
                </div>
                <div class="selection nav-settings w-100 d-flex align-items-center">
                    <a href="Settings.html" class="nav-link">
                        <span class="nav-badge">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15 1.65 1.65 0 0 0 3.17 14H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.31.22.65.22 1H21a2 2 0 0 1 0 4h-.09c-.35 0-.69.08-1 .22Z"></path></svg>
                        </span>
                        <span class="nav-label">Pengaturan</span>
                    </a>
                </div>
                <div class="selection nav-profile active w-100 d-flex align-items-center">
                    <a href="Account.html" class="nav-link">
                        <span class="nav-badge">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"></path></svg>
                        </span>
                        <span class="nav-label">Akun Saya</span>
                    </a>
                </div>
                <div class="selection nav-tickets w-100 d-flex align-items-center">
                    <a href="tickets.html" class="nav-link">
                        <span class="nav-badge">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9V7a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v2a2 2 0 0 0 0 6v2a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-2a2 2 0 0 0 0-6z"></path><path d="M15 6v12" stroke-dasharray="2 3"></path></svg>
                        </span>
                        <span class="nav-label">Jual Tiket</span>
                    </a>
                </div>
            </div>
        </div>

        <div class="top-nav">
            <div class="top-icon d-flex align-items-center h-100 px-4">
                <img src="assets/logo.png" alt="">
                
                <div class="diva flex-grow-1"></div>
                <a href="../index.html" class="d-flex align-items-center"><img src="assets/Fpage.png" alt=""></a>
                <a href="#" class="d-flex align-items-center"><img src="assets/Notif.png" alt=""></a>
                <a href="#" class="d-flex align-items-center"><img src="assets/Email.png" alt=""></a>
                
                <div class="user-profile d-flex align-items-center gap-3 border-start border-2 ps-3">
                    <a href="#"><img class="Profile_picture rounded-circle" src="assets/profiles/p1.png" alt=""></a>
                    
                    <div class="divs d-flex flex-column justify-content-center">
                        <p id="navUsername" class="username fw-bold text-dark mb-0">Loading...</p>
                        <p id="navEmail" class="Email-name mb-0">...</p>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main>
    </main>

    <script type="module">
        import { pb } from '../src/pocketbase';

        if (pb.authStore.isValid && pb.authStore.model) {
            const user = pb.authStore.model;
            
            const usernameEl = document.querySelector('#navUsername');
            const emailEl = document.querySelector('#navEmail');

            if (usernameEl) usernameEl.textContent = user.username || 'User';
            if (emailEl) emailEl.textContent = user.email || '';
        } else {
            window.location.href = '../login.html';
        }
    </script>
</body>
</html>
