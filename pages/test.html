<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booked Ticket Card</title>
    <style>
        /* ============================================
           RESET & BASIC SETUP (Hanya untuk preview)
           ============================================ */
        body {
            background-color: #F3F4F6;
            padding: 40px 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
        }

        /* Container pembungkus grid */
        .bk-list {
            display: grid;
            grid-template-columns: minmax(0, 800px); /* Dibuat 1 kolom untuk fokus ke 1 kartu */
            width: 100%;
            justify-content: center;
        }

        /* ============================================
           BASE TIKET CSS (Dari kode Anda)
           ============================================ */
        :root {
            --bk-text: #111827;
            --bk-text-secondary: #374151;
            --bk-text-muted: #6B7280;
            --bk-text-faint: #9CA3AF;

            --bk-border: #E5E7EB;
            --bk-border-strong: #D1D5DB;

            --bk-accent: #4338CA;
            --bk-accent-blue: #3283e7;
            --bk-accent-blue-hover: #206ac7;

            --bk-success-bg: #E8F5E9;
            --bk-success-text: #1B5E20;
            --bk-warning-bg: #FEF3C7;
            --bk-warning-text: #D97706;
            --bk-neutral-bg: #F3F4F6;
            --bk-neutral-text: #6B7280;
            --bk-danger: #DC2626;
            --bk-disabled: #D1D5DB;

            --bk-radius: 12px;
            --bk-radius-sm: 6px;
            --bk-card-height: 290px;
        }

        .bk-card {
            position: relative;
            display: flex;
            gap: 24px;
            padding: 24px;
            height: var(--bk-card-height);
            background-color: #FFFFFF;
            border: 1px solid var(--bk-border);
            border-radius: var(--bk-radius);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }

        .bk-status {
            position: absolute;
            top: 20px;
            right: 24px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
        }

        .bk-status::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }

        .bk-airline {
            flex: 0 0 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bk-airline img {
            width: 180%;
            max-width: 120px;
            height: auto;
            object-fit: contain;
        }

        .bk-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
            min-height: 0;
        }

        .bk-route {
            font-size: 16px;
            font-weight: 700;
            color: var(--bk-text);
            margin-bottom: 15px;
        }

        .bk-meta-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        .bk-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            color: var(--bk-text-secondary);
        }

        .bk-meta img {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            opacity: 0.7;
        }

        .bk-leg-toggle {
            display: inline-flex;
            top: 10px;
            position: relative;
            align-items: center;
            gap: 5px;
            width: fit-content;
            padding: 12px 40px;
            background-color: #F0EFEF;
            border: 1px solid var(--bk-border-strong);
            border-radius: 15px;
            font-size: 13px;
            font-weight: 600;
            color: var(--bk-accent);
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .bk-leg-toggle:hover {
            background: #b2b2b2;
        }

        .bk-leg-toggle img {
            width: 14px;
            height: 14px;
        }

        .bk-leg-toggle span {
            color: #3283e7;
        }

        .bk-divider {
            width: 1px;
            background-color: var(--bk-border);
            align-self: stretch;
        }

        .bk-booking {
            flex: 1.1;
            display: flex;
            justify-content: space-between;
            gap: 16px;
            min-height: 0;
        }

        .bk-booking-pending {
            flex-direction: column;
            justify-content: flex-start;
        }

        .bk-info-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .bk-label {
            font-size: 12px;
            color: var(--bk-text-muted);
        }

        .bk-price {
            font-size: 18px;
            font-weight: 700;
            color: var(--bk-text);
        }

        .bk-pending-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .bk-text-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            text-align: right;
            gap: 6px;
        }

        .bk-pay {
            width: 100%;
            margin-top: 14px;
            padding: 12px;
            background-color: var(--bk-accent-blue);
            color: #FFFFFF;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            flex-shrink: 0;
        }

        .bk-pay:hover:not(:disabled) {
            background-color: var(--bk-accent-blue-hover);
        }

        /* ============================================
           CSS KHUSUS KARTU "BOOKED"
           ============================================ */
        
        .bk-card--booked {
            background-color: #F8F9FA;
            border: none;
        }

        .bk-status--booked {
            background-color: #E6F3FE;
            color: #1E66B4;
        }

        .bk-value-code {
            font-size: 15px;
            font-weight: 500;
            color: var(--bk-text);
        }

        .bk-payment-detail {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--bk-text);
            margin-top: 10px;
        }

        .bk-percentage {
            font-size: 12px;
            font-weight: 500;
            color: var(--bk-text-secondary);
        }

        .bk-due-date {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--bk-text-faint);
        }

        .bk-due-date strong {
            color: var(--bk-text-secondary);
            font-weight: 600;
        }

        .bk-row-bottom--booked {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 12px;
            margin-top: 16px;
            width: 100%;
        }

        .bk-pay--primary {
            background-color: #2689F1;
            font-size: 16px;
        }

        .bk-pay--primary:hover:not(:disabled) {
            background-color: #1a7ae0;
        }

        /* ============================================
           RESPONSIVE (Dari kode Anda)
           ============================================ */
        @media (max-width: 1040px) {
            .bk-card {
                height: auto;
                min-height: var(--bk-card-height);
                overflow: visible;
            }
        }

        @media (max-width: 900px) {
            .bk-card {
                flex-direction: column;
                gap: 16px;
                padding: 20px;
                height: auto;
                min-height: 0;
            }

            .bk-status {
                position: static;
                align-self: flex-start;
            }

            .bk-airline {
                flex: 0 0 auto;
                align-self: flex-start;
            }

            .bk-airline img {
                width: auto;
                max-width: 100px;
            }

            .bk-divider {
                width: 100%;
                height: 1px;
                align-self: auto;
            }

            .bk-details {
                justify-content: flex-start;
            }

            .bk-booking {
                flex-direction: column;
                gap: 12px;
            }

            .bk-leg-toggle {
                top: 0;
                width: 100%;
                justify-content: center;
                padding: 10px 20px;
            }
        }

        @media (max-width: 640px) {
            .bk-card {
                padding: 16px;
                gap: 12px;
                min-height: 0;
            }

            .bk-route {
                font-size: 15px;
                margin-bottom: 12px;
            }

            .bk-meta {
                font-size: 13px;
                gap: 10px;
            }

            .bk-price {
                font-size: 16px;
            }

            .bk-pending-row {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }

            .bk-text-right {
                align-items: flex-start;
                text-align: left;
            }
        }
    </style>
</head>
<body>

    <div class="bk-list">
        
        <!-- KARTU BOOKED -->
        <div class="bk-card bk-card--booked">
            
            <!-- Status Pill -->
            <div class="bk-status bk-status--booked">Booked</div>

            <!-- Kolom 1: Maskapai -->
            <div class="bk-airline">
                <!-- Fallback image base64 Garuda jika path lokal belum jalan di preview -->
                <img src="/Airlines/Garuda.png" alt="Garuda Indonesia" onerror="this.src='https://upload.wikimedia.org/wikipedia/id/thumb/7/73/Garuda_Indonesia_Logo.svg/1200px-Garuda_Indonesia_Logo.svg.png'">
            </div>

            <!-- Kolom 2: Detail penerbangan -->
            <div class="bk-details">
                <div class="bk-route">Jakarta (CGK) &rarr; Bali (DPS)</div>
                
                <div class="bk-meta-list">
                    <div class="bk-meta">
                        <!-- Icon Placeholder -->
                        <span style="font-size: 16px;">📅</span> 
                        <span>12 Agustus 2026</span>
                    </div>
                    <div class="bk-meta">
                        <span style="font-size: 16px;">🕒</span>
                        <span>08.15 - 11.05 WIB</span>
                    </div>
                    <div class="bk-meta">
                        <span style="font-size: 16px;">✈️</span>
                        <span>GA-412</span>
                    </div>
                    <div class="bk-meta">
                        <span style="font-size: 16px;">👤</span>
                        <span>Caesar Ibrahim</span>
                    </div>
                </div>

                <button class="bk-leg-toggle" type="button">
                    <span>✈️</span>
                    <span>penerbangan pergi</span>
                </button>
            </div>

            <!-- Kolom 3: Pembatas -->
            <div class="bk-divider"></div>

            <!-- Kolom 4: Info pemesanan -->
            <div class="bk-booking bk-booking-pending">
                
                <!-- Baris Kode Pemesanan -->
                <div class="bk-pending-row">
                    <div class="bk-info-group">
                        <span class="bk-label">Kode pemesanan</span>
                        <span class="bk-value bk-value-code">TICKET-1rxms3aPt</span>
                    </div>
                </div>

                <!-- Baris Sisa Tagihan & Persentase -->
                <div class="bk-pending-row" style="margin-top: 16px;">
                    <div class="bk-info-group">
                        <span class="bk-label">sisa tagihan</span>
                        <span class="bk-price">Rp 33.800.8000</span>
                        <span class="bk-payment-detail">
                            Rp 1.800.8000 dari Rp 34.800.8000
                        </span>
                    </div>
                    <div class="bk-text-right">
                        <span class="bk-percentage">15% terbayar</span>
                    </div>
                </div>

                <!-- Baris Bawah: Info Jatuh Tempo & Tombol -->
                <div class="bk-row-bottom bk-row-bottom--booked">
                    <div class="bk-due-date">
                        <span>📅</span>
                        <span>Lunasi sebelum 15 Sep 2026 &middot; <strong>12 hari lagi</strong></span>
                    </div>
                    <button class="bk-pay bk-pay--primary" type="button">
                        Pelunasan tiket
                    </button>
                </div>
                
            </div>
        </div>
        <!-- AKHIR KARTU BOOKED -->

    </div>

</body>
</html>
