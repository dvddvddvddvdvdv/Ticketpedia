<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>TicketPedia - Settings</title>
    <!-- Added Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/Settings.css">
    <link rel="stylesheet" href="/css/global.css">
</head>
<body>
     <nav>
        <div class="nav">
            <div class="icon d-flex flex-column align-items-center gap-2">
                <img class="title" src="assets/ticketpedia.png" alt="TicketPedia Logo">
                
                <div class="menu w-100 ps-3 pb-3">
                    <img src="assets/MENU.png" alt="Menu">
                </div>

                <!-- Unselected Home -->
                <div class="selection w-100 d-flex align-items-center">
                    <a href="dashboard.html"><img src="assets/Home.png" alt="Home"></a>
                </div>
                <!-- SELECTED: Settings -->
                <div class="selection position-relative w-100 d-flex align-items-center">
                    <div class="selected position-absolute start-0 top-50 translate-middle-y"></div>
                    <a href="Settings.html"><img src="assets/gear_sel.png" alt="Settings"></a>
                </div>
                <!-- Unselected Profile -->
                <div class="selection w-100 d-flex align-items-center">
                    <a href="Account.html"><img src="assets/profile.png" alt="Profile"></a>
                </div>
                <!-- Unselected Tickets -->
                <div class="selection w-100 d-flex align-items-center">
                    <a href="tickets.html"><img src="assets/tickets.png" alt="Tickets"></a>
                </div>
            </div>
        </div>

        <div class="top-nav">
            <div class="top-icon d-flex align-items-center h-100 px-4">
                <img src="assets/logo.png" alt="">
                
                <div class="diva flex-grow-1"></div>
                <a href="../index.html" class="d-flex align-items-center"><img src="assets/Fpage.png" alt=""></a>
                <a href="#" class="d-flex align-items-center"><img src="assets/Notif.png" alt=""></a>
                <a href="#" class="d-flex align-items-center"><img src="assets/Email.png" alt=""></a>
                
                <div class="user-profile d-flex align-items-center gap-3 border-start border-2 ps-3">
                    <a href="#"><img class="Profile_picture rounded-circle" src="assets/profiles/p1.png" alt=""></a>
                    
                    <div class="divs d-flex flex-column justify-content-center">
                        <p id="navUsername" class="username fw-bold text-dark mb-0">Loading...</p>
                        <p id="navEmail" class="Email-name mb-0">...</p>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main>
    </main>

    <script type="module">
        import { pb } from '../src/pocketbase';

        if (pb.authStore.isValid && pb.authStore.model) {
            const user = pb.authStore.model;
            
            const usernameEl = document.querySelector('#navUsername');
            const emailEl = document.querySelector('#navEmail');

            if (usernameEl) usernameEl.textContent = user.username || 'User';
            if (emailEl) emailEl.textContent = user.email || '';
        } else {
            window.location.href = '../login.html';
        }
    </script>
</body>
</html>
