<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - TicketPedia</title>
    <link rel="stylesheet" href="log.css">
</head>
<body>
    <div class="right-panel">
        <div class="brand-header">
            <div class="title">
                <img class="ticket" src="assets/title_head1.png" alt="TicketPedia">
            </div>
            <div class="sub">
                <img src="assets/travel.png" alt="Travel Agency Indonesia">
            </div>
        </div>

        <form id="registerForm">
            <div class="form-group" style="margin-bottom: 20px;">
                <label for="username">Username</label>
                <input type="text" id="username" class="form-control" placeholder="Panca Admin">
            </div>

            <div class="form-group" style="margin-bottom: 20px;">
                <label for="email">Email</label>
                <input type="text" id="email" class="form-control" placeholder="panca@example.com">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••">
            </div>

            <button type="submit" class="btn-primary">Buat Akun</button>
        </form>
        
        <div class="footer-text" style="margin-top: 30px; text-align: center; padding-left: 0;">
            Sudah punya akun? <a href="login_page.html">Login</a>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(event) {
            event.preventDefault(); 

            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // --- NEW: Check for spaces in username ---
            if (/\s/.test(username)) {
                alert('Error: Usernames cannot contain spaces.');
                return;
            }

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                const result = await response.json();

                if (result.success) {
                    alert('Registration Successful! You can now log in.');
                    window.location.href = 'login_page.html'; 
                } else {
                    alert('Error: ' + result.message);
                }
            } catch (error) {
                console.error('Error registering:', error);
                alert('Could not connect to the server.');
            }
        });
    </script>
</body>
</html>
