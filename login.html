<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - TicketPedia</title>
    <link rel="stylesheet" href="log.css">
</head>
<body>
    <div class="right-panel">
        <div class="brand-header">
            <div class="title">
                <img class="ticket" src="assets/title_head1.png" alt="TicketPedia">
            </div>
            <div class="sub">
                <img src="assets/travel.png" alt="Travel Agency Indonesia">
            </div>
        </div>

        <form id="registerForm">
            <div class="form-group" style="margin-bottom: 20px;">
                <label for="username">Username</label>
                <input type="text" id="username" class="form-control" placeholder="Panca Admin">
            </div>

            <div class="form-group" style="margin-bottom: 20px;">
                <label for="email">Email</label>
                <input type="text" id="email" class="form-control" placeholder="panca@example.com">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••">
            </div>

            <button type="submit" class="btn-primary">login</button>
        </form>
        
        <div class="footer-text" style="margin-top: 30px; text-align: center; padding-left: 0;">
            belum punya akun? <a href="register.html">Signin</a>
        </div>
    </div>

    <script type="module" src="/src/login.ts"></script>
</body>
</html>
